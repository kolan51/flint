name: Bug
description: The studio did the wrong thing.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Name the agent, the file, and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows
        - macOS
        - Ubuntu
        - From source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Flint version
      placeholder: 0.1.4
    validations:
      required: true
